name: Release Ghidra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        type: string

concurrency:
  group: release-ghidra-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out requested tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --force --tags
          if ! git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' does not exist" >&2
            exit 1
          fi
          git checkout "refs/tags/$RELEASE_TAG"

      - name: Read Ghidra JDK Version
        shell: bash
        run: echo "JDK_VER=$(awk -F'=' '$1==\"application.java.min\" {print $2}' Ghidra/application.properties)" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        run: ./gradlew buildGhidra --parallel

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/dist/ghidra_*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out requested tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --force --tags
          if ! git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' does not exist" >&2
            exit 1
          fi
          git checkout "refs/tags/$RELEASE_TAG"

      - name: Download Platform Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge Platform Artifacts
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          zip_paths = sorted(Path("artifacts").glob("**/ghidra_*.zip"))
          if not zip_paths:
            raise SystemExit("No built release zips were found")

          release_dir = Path("release")
          release_dir.mkdir(exist_ok=True)

          for zip_path in zip_paths:
            platform_dir = zip_path.parent.name
            shutil.copy2(zip_path, release_dir / f"{platform_dir}-{zip_path.name}")

          merged_path = release_dir / zip_paths[0].name
          seen = {}

          with ZipFile(merged_path, "w") as merged_zip:
            for zip_path in zip_paths:
              with ZipFile(zip_path) as source_zip:
                for info in source_zip.infolist():
                  data = source_zip.read(info.filename)
                  digest = hashlib.sha256(data).hexdigest()

                  previous = seen.get(info.filename)
                  if previous is not None:
                    if previous != digest:
                      raise SystemExit(
                        f"Conflicting file contents for {info.filename} between release archives"
                      )
                    continue

                  seen[info.filename] = digest
                  merged_zip.writestr(copy.copy(info), data)
          PY

      - name: Generate Release Checksums
        shell: bash
        run: |
          cd release
          sha256sum ./* > SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --generate-notes
          fi
