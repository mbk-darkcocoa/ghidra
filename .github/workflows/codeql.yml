name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: java-kotlin,c-cpp
            languages: java-kotlin,c-cpp
            build-mode: manual
            compiled: true
          - label: python
            languages: python
            build-mode: none
            compiled: false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read build JDK version
        id: java-version
        shell: bash
        run: |
          echo "version=$(awk -F= '/^application.java.compiler=/{print $2}' Ghidra/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: matrix.compiled
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}
          cache: gradle

      - name: Start Xvfb
        if: matrix.compiled
        run: |
          /usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.languages }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build Ghidra
        if: matrix.compiled
        run: ./gradlew -I gradle/support/fetchDependencies.gradle buildNatives buildGhidra

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
